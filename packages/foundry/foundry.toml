[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib', 'node_modules']
fs_permissions = [{ access = "read-write", path = "./"}]

# Use this profile for real/public deployments and explorer verification.
# Current Sepolia canary evidence shows `PrisonersDaollema` exceeds the EVM
# contract size limit when built with the unoptimized default profile, but fits
# safely when compiled with via-IR + optimizer enabled.
[profile.production]
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
default_network = "http://127.0.0.1:8545"

mainnet = "https://eth-mainnet.alchemyapi.io/v2/${ALCHEMY_API_KEY}"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base = "https://mainnet.base.org"
baseSepolia = "https://sepolia.base.org"
localhost = "http://127.0.0.1:8545"

[etherscan]
base = { key = "${BASESCAN_API_KEY}" }
baseSepolia = { key = "${BASESCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
bracket_spacing = true
int_types = "long"

[invariant]
runs = 32
depth = 64
fail_on_revert = true
